{% extends "base_auth.html" %}
{% block title %}Crear administrador{% endblock %}
{% block content %}
<h1 style="font-size:19px;margin:14px 0 4px">Crear administrador</h1>
<div class="muted small" style="margin-bottom:14px">
  Primer arranque: define la cuenta con la que entrarás a la consola.
</div>
<form method="post" action="/setup">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="field" style="margin-bottom:10px">
    <span>Usuario</span>
    <input name="username" type="text" autocomplete="username" required autofocus placeholder="admin">
  </div>
  <div class="field" style="margin-bottom:10px">
    <span>Contraseña</span>
    <input name="password" type="password" autocomplete="new-password" required>
  </div>
  <div class="field" style="margin-bottom:10px">
    <span>Repetir contraseña</span>
    <input name="confirm" type="password" autocomplete="new-password" required>
  </div>
  <button class="btn" type="submit" style="width:100%">Crear y entrar</button>
</form>
{% endblock %}
